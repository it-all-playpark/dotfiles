# agent-vault 経由の Claude Code セッションで gh が使う hosts.yml（th-it-dev アカウント）。
# oauth_token は本物の token ではなく placeholder。agent-vault が api.github.com への
# リクエストの placeholder を vault の GH_TOKEN_TH_IT_DEV に置き換える（agent-vault/services.yaml）。
# account-exec が CLAUDE_GH_VAULT=1 のとき、account-map.json でこの dir を指す org で使う。
github.com:
    users:
        th-it-dev:
            oauth_token: __gh_th_it_dev__
    git_protocol: https
    oauth_token: __gh_th_it_dev__
    user: th-it-dev
