# agent-vault 経由の Claude Code セッションで gh が使う hosts.yml（main アカウント）。
# oauth_token は本物の token ではなく placeholder。agent-vault が api.github.com への
# リクエストの placeholder を vault の GH_TOKEN_MAIN に置き換える（agent-vault/services.yaml）。
# account-exec が CLAUDE_GH_VAULT=1 のとき GH_CONFIG_DIR をこの dir に向ける。
github.com:
    users:
        it-all-playpark:
            oauth_token: __gh_main__
    git_protocol: https
    oauth_token: __gh_main__
    user: it-all-playpark
