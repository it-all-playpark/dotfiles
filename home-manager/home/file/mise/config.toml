[env]
_.file = '.env'

[tools]
node = "lts"
python = "latest"
uv = "latest"
"npm:git-cz" = "latest"
"npm:mcp-hub" = "latest"
"npm:vercel" = "latest"
"codex" = "latest"
"copilot" = "latest"
"npm:wrangler" = "latest"
"npm:tsx" = "latest"
"npm:memvid-cli" = "latest"
"npm:neonctl" = "latest"
"npm:repomix" = "latest"
"pipx:whisply" = "latest"
"pipx:mlx-whisper" = "latest"
"claude-code" = "latest"
"npm:pnpm" = "latest"
"npm:yarn" = "latest"
rust = "latest"
go = "latest"
java = "21"
# git の textconv ドライバ (diff.office) が呼ぶ Office 抽出ツール。
# docx/doc/xlsx/xls/pptx を Markdown に変換する。詳細は
# home-manager/programs/git.nix と各リポジトリの .gitattributes を参照。
"cargo:office_oxide_cli" = "latest"

[settings]
experimental = true
# 供給網攻撃対策の minimum_release_age (default: 24h) から除外し、リリース即日で追随する。
# いずれも GitHub Releases (aqua) 直取得のためリスク低。npm:* 系は 24h ガードを維持する。
minimum_release_age_excludes = ["claude-code", "codex", "copilot"]
