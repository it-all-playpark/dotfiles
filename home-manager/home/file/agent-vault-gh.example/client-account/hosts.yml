# 例: agent-vault 経由の Claude Code セッションで gh が使う hosts.yml（main 以外のアカウント）。
# 本物は private repo（it-all-playpark/dotfiles-private）の agent-vault-gh/<account>/hosts.yml に置き、
# activation が ~/.config/agent-vault-gh/<account>/ に張る（main は home.file が配る）。
# oauth_token は本物の token ではなく placeholder。agent-vault が api.github.com への
# リクエストの placeholder を vault の GH_TOKEN_CLIENT に置き換える（agent-vault/services.yaml）。
# account-exec が CLAUDE_GH_VAULT=1 のとき、account-map.json でこの dir を指す org で使う。
github.com:
    users:
        client-account:
            oauth_token: __gh_client__
    git_protocol: https
    oauth_token: __gh_client__
    user: client-account
